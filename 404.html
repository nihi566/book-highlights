<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移転しました - bookshelf</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://nihi566.github.io/bookshelf/">
<script>
function newPath(p) {
  var re = /^\/book-highlights(?=\/|$)/;
  return re.test(p) ? p.replace(re, '/bookshelf') : '/bookshelf/';
}
if (typeof location !== 'undefined' && typeof module === 'undefined') {
  location.replace(newPath(location.pathname) + location.search + location.hash);
}
if (typeof module !== 'undefined') module.exports = { newPath: newPath };
</script>
