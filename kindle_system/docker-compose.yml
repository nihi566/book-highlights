services:
  # ─── Python クローラー (Playwright + SSE) + フロントエンド配信 ──────
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # SQLite DB の永続化
      - ./data:/app/data
      # Kindle キャッシュXML のマウント（読み取り専用）
      - ${KINDLE_CACHE_DIR}:/kindle_cache:ro
    environment:
      - KINDLE_XML_PATH=/kindle_cache/KindleSyncMetadataCache.xml
      - CRAWLER_PORT=8001
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
    restart: unless-stopped
