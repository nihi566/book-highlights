services:
  # ─── Laravel API サーバー + React 配信 ─────────────────────────
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kindle-laravel
    ports:
      - "8765:80"
    volumes:
      # SQLite DB の永続化（Laravel と crawler が共有）
      - ./data:/app/data
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/data/kindle_monitor.db
      - CRAWLER_URL=http://crawler:8001
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
    depends_on:
      - crawler
    restart: unless-stopped

  # ─── Python クローラー (Playwright + SSE) ──────────────────────
  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: kindle-crawler
    ports:
      - "8001:8001"
    volumes:
      # SQLite DB の永続化（Laravel と共有）
      - ./data:/app/data
      # Kindle キャッシュXML のマウント（読み取り専用）
      - ${KINDLE_CACHE_DIR}:/kindle_cache:ro
    environment:
      - KINDLE_XML_PATH=/kindle_cache/KindleSyncMetadataCache.xml
      - CRAWLER_PORT=8001
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
    restart: unless-stopped
