<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>本 — 読書ハイライト</title>
  <meta name="description" content="Play Books と Kindle のハイライトを集めて Obsidian へ。ローカル LLM が知識を点→線→面→立体に組み立てます。">
  <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="本">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="ホーム"><span class="brand-mark" aria-hidden="true"></span>本</a>
    <span id="status" class="topbar-status" aria-live="polite"></span>
  </header>
  <main id="view" tabindex="-1">
    <p class="loading">読み込み中…</p>
  </main>
  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/></svg><span>ホーム</span></a>
    <a href="#/wishlist" data-tab="price"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5V4.5h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.5"/></svg><span>価格チェック</span></a>
    <a href="#/books" data-tab="books"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.3 9.5 4.3 12 6c2.5-1.7 5.5-1.7 8-.5V19c-2.5-1.2-5.5-1.2-8 .5-2.5-1.7-5.5-1.7-8-.5z M12 6v13.5"/></svg><span>読んだ本</span></a>
    <a href="#/knowledge" data-tab="knowledge"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="12" cy="11" r="1.6"/><path d="M6.8 6.9 10.6 10M17.2 7.9l-3.8 2.4M12 12.6V16"/></svg><span>知識</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>設定</span></a>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet" class="sheet"></dialog>
  <noscript><p class="loading">このアプリには JavaScript が必要です。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
